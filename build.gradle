/*
 * opensha dependencies
 */

import org.gradle.api.tasks.testing.TestDescriptor
import org.gradle.api.tasks.testing.TestListener
import org.gradle.api.tasks.testing.TestResult

apply plugin: 'java-library'
apply plugin: 'eclipse'

ext {
	parentProject = null
}

apply from: 'build-common.gradle'

// added any resource exclusions here that we don't need in builds
sourceSets {
	main {
		resources {
			exclude '**/doc'
			exclude '**/data/ngaWest'
			exclude '**/data/site'
			exclude '**/scratchData'
			exclude '**/data/erf/new_zealand_2010'
			exclude '**/data/erf/step/AllCal96ModelDaily.txt'
			exclude '**/data/erf/ucerf3/EarthquakeCatalog'
			exclude '**/data/erf/nshm23/seismicity/spatial_seis_pdfs/*/CONUS_EAST'
		}
	}
}

test {
	useJUnit()

	minHeapSize = "128m"
	maxHeapSize = "2048m"

	// Preserve current default behavior: plain './gradlew test' only runs suites.
	// But allow './gradlew test --tests SomeSpecificTest' to bypass the Suite-only filter.
	doFirst {
		if (filter.commandLineIncludePatterns.empty) {
			filter.includeTestsMatching "*Suite*"
		}
	}
}

task testVerbose(type: Test) {
	testClassesDirs = sourceSets.test.output.classesDirs
	classpath = sourceSets.test.runtimeClasspath

	useJUnit()

	testLogging {
		events "failed"
	}

	addTestListener([
		beforeSuite: { TestDescriptor descr ->
			println("Executing SUITE: $descr.className > $descr.displayName")
		},
		beforeTest: { TestDescriptor descr ->
			// no-op
		},
		afterTest: { TestDescriptor descr, TestResult result ->
			def time = (result.endTime - result.startTime)/1000.0
			if (time > 1)
				println("\t$descr.className > $descr.displayName: $result.resultType in $time s")
		},
		afterSuite: { TestDescriptor descr, TestResult result ->
			if (descr.className != null) {
				def time = (result.endTime - result.startTime)/1000.0
				println("SUITE $descr.className: $result.resultType in $time s")
			}
		}
	] as TestListener)

	minHeapSize = "128m"
	maxHeapSize = "2048m"

	doFirst {
		if (filter.commandLineIncludePatterns.empty) {
			filter.includeTestsMatching "*Suite*"
		}
	}
}

task testOperational(type: Test) {
	testClassesDirs = sourceSets.test.output.classesDirs
	classpath = sourceSets.test.runtimeClasspath

	useJUnit()

	systemProperty "random.testing.seed", new Random().nextInt()
	testLogging {
		events "passed", "skipped", "failed"
	}
	filter {
		includeTestsMatching "*Operational*"
	}
}

dependencies {

	api 'org.opensha:opensha-nshmp-gmm:1.8.4-opensha.1' // when you update this, also update nshmp-haz in dev to match

	api 'com.google.guava:guava:31.1-jre'
	api 'com.google.code.gson:gson:2.8.9'
	api 'org.jfree:jfreechart:1.5.6'
	api 'org.jfree:org.jfree.chart3d:2.1.1'
	api 'org.dom4j:dom4j:2.2.0'
	api 'edu.stanford.ejalbert:BrowserLauncher2:1.3'
	api 'com.itextpdf:itextpdf:5.5.13.5'
	api 'gov.nist.math:jama:1.0.3'
	api 'javax.servlet:javax.servlet-api:4.0.1'
	api 'org.apache.poi:poi:5.5.1'
	api 'net.mahdilamb:colormap:0.9.511'
	api('net.sourceforge.parallelcolt:parallelcolt:0.10.1') {
		// parallel colt on maven comes with an old junit version that confuses eclipse and has a vulnerability
		exclude group: 'junit', module: 'junit'
	}
	api 'net.sourceforge.csparsej:csparsej:1.1.1'
	api ('com.googlecode.json-simple:json-simple:1.1.1') {
		// used by EventWebService.jar
		// json-simple on maven comes with an old junit version that confuses eclipse and has a vulnerability
		exclude group: 'junit', module: 'junit'
	}
	
	/* legacy oracle DB/spatial; TODO: refactor away */
	api 'com.oracle.database.spatial:sdoapi:23.26'
	api 'com.oracle.database.jdbc:ojdbc5:11.2.0.4'
	
	/* logging */
	// this is the generic api
	api 'org.slf4j:slf4j-api:2.0.18'
	// include an implementation only when running and building fat jars
	runtimeOnly 'org.slf4j:slf4j-simple:2.0.18'
	
	/* apache commons */
	api 'org.apache.commons:commons-lang3:3.20.0'
	api 'org.apache.commons:commons-text:1.15.0'
	api 'commons-cli:commons-cli:1.11.0'
	api 'commons-io:commons-io:2.21.0'
	api 'org.apache.commons:commons-math3:3.6.1'
	api 'org.apache.commons:commons-compress:1.28.0'
	api 'org.apache.commons:commons-statistics-distribution:1.3'
	api 'org.apache.commons:commons-rng-simple:1.6'
	
	/* Atlassan commonmark - Markdown utilities */
	api 'org.commonmark:commonmark:0.29.0'
	api 'org.commonmark:commonmark-ext-gfm-tables:0.29.0'
	api 'org.commonmark:commonmark-ext-heading-anchor:0.29.0'
	
	/* no remote repo */
	// MPJ API; keep this as a jar, but can skip it as a maven dependency as any real runtime configurations
	// will have an MPJ implementation on the classpath. But keep it as 'api' rather than 'implementation' to support
	// running our MPJ apps in single-node mode
	api files('lib/mpj-0.44.jar')
	api files('lib/getfile-all.jar')
	api files('lib/mpj-task-calculator-1.1.jar') // MPJTaskCalculator
	api files('lib/EventWebService.jar')

	testImplementation 'junit:junit:4.13.2'
	testImplementation 'org.mockito:mockito-core:5.23.0'
}

// application build tasks
ext {
	appSuffix = '-'+getDate()+'-'+getGitHash()
}
createAppTask("appJarHC", "HazardCurveGUI"+appSuffix, "org.opensha.sha.gui.HazardCurveApplication")
createAppTask("appJarHS", "HazardSpectrumGUI"+appSuffix, "org.opensha.sha.gui.HazardSpectrumApplication")
createAppTask("appJarAR", "AttenuationRelationshipGUI"+appSuffix, "org.opensha.sha.imr.attenRelImpl.gui.AttenuationRelationshipApplet")
createAppTask("appJarSM", "ShakeMapGUI"+appSuffix, "org.opensha.sha.gui.ScenarioShakeMapApp")
createAppTask("appJarSD", "SiteDataGUI"+appSuffix, "org.opensha.commons.data.siteData.gui.SiteDataCombinedApp")
createAppTask("appJarGMT", "GMTMapApp"+appSuffix, "org.opensha.commons.mapping.gmt.gui.GMT_MapGeneratorApplet")
createAppTask("appJarIM-CLT", "IMEventSetCalculatorCLT"+appSuffix, "org.opensha.sha.calc.IM_EventSet.IMEventSetCalculatorCLT")
createAppTask("appJarIM-GUI", "IMEventSetCalculatorGUI"+appSuffix, "org.opensha.sha.calc.IM_EventSet.gui.IMEventSetCalculatorGUI")

task appZipIM(type: Zip) {
	dependsOn 'appJarIM-CLT'
	from ('build/libs/') {
		include 'IMEventSetCalculatorCLT-'+getDate()+'-'+getGitHash()+'.jar'
		rename (('IMEventSetCalculatorCLT-'+getDate()+'-'+getGitHash()+'.jar'), 'IMEventSetCalculatorCLT.jar')
	}
	from ('src/main/java/org/opensha/sha/calc/IM_EventSet/') {
		include '*.txt'
		include '*.csv'
	}
	archiveFileName = 'IMEventSetCalculatorCLT.zip'
	doFirst {
		System.out.println("Assembling IM Event Set zip file: ./build/distributions/IMEventSetCalculatorCLT.zip")
	}
}

tasks.register('appJars') {
	dependsOn 'appJarHC', 'appJarHS', 'appJarAR', 'appJarSM', 'appJarSD', 'appJarGMT', 'appZipIM', 'appJarIM-GUI'
}
